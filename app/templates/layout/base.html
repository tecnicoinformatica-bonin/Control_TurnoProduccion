<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Control de Turnos{% endblock %}</title>

    <!-- ICON -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/favicon.png') }}"
    />

    <!-- BOOTSTRAP 5 -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />

    <!-- SWEETALERT2 -->
    <script src="{{ url_for('static', filename='libs/sweetalert/sweetalert2.all.min.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/sweetalert/sweetalert2.min.css') }}"
    />

    <!-- TABULATOR -->
    <script src="{{ url_for('static', filename='libs/tabulator/tabulator.min.js') }}"></script>
    <script src="{{ url_for('static', filename='libs/luxon/luxon.min.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/tabulator/tabulator.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/tabulator/tabulator_bootstrap5.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/tabulator/tabulator_site_dark.min.css') }}"
    />

    <!-- COLORIS -->
     <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/Coloris/coloris.min.css') }}"
    />
    <script src="{{ url_for('static', filename='libs/Coloris/coloris.min.js') }}"></script>

    <!-- STYLE CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body class="body-bg">
    {% include "layout/navbar.html" %}

    <div class="container-fluid">
      <div class="row">
        {% if current_user.is_authenticated and current_user.tiene_permiso("panel.administrador") %}
        <div
          class="col-md-2 bg-light vh-100 shadow p-3 mb-5 bg-body-tertiary rounded"
        >
          {% include "layout/sidebar.html" %}
        </div>
        {% endif %}

        <div
          class="{% if current_user.tiene_permiso('panel.administrador') %} col-md-10 p-4 {% endif %}"
        >
          {% block content %} {% endblock %}
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
  <script>
    window.USER_CONTEXT = {
        permisos: JSON.parse('{{ current_user.permisos | tojson }}'),
        roles: JSON.parse('{{ current_user.roles | tojson }}'),
        departamentosUsuario: JSON.parse('{{ current_user.departamentos | tojson }}'),
        scopeGlobal: JSON.parse('{{ current_user.scope_departamentos_global | tojson }}')
    }

    function tienePermiso(permiso) {
      return window.USER_CONTEXT?.permisos?.includes(permiso) ?? false;
    }

    function tieneRol(rol) {
      return window.USER_CONTEXT?.roles?.includes(rol) ?? false;
    }

    function puedeVerDepartamento(idDepartment) {
      if (window.USER_CONTEXT?.scopeGlobal) {
        return true;
      }

      return window.USER_CONTEXT?.departamentos?.some(
        (d) => d.idDepartment === idDepartment,
      );
    }

    // console.log(window.USER_CONTEXT.departamentosUsuario);
    // console.log(window.USER_CONTEXT.permisos);
  </script>
</html>
