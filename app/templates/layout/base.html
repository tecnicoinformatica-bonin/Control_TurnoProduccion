<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Control de Turnos{% endblock %}</title>

    <!-- ICON -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/favicon.png') }}"
    />

    <!-- BOOTSTRAP 5 -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />

    <!-- SWEETALERT2 -->
    <script src="{{ url_for('static', filename='libs/sweetalert/sweetalert2.all.min.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='libs/sweetalert/sweetalert2.min.css') }}"
    />

    <!-- STYLE CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body class="body-bg">
    {% include "layout/navbar.html" %}

    <div class="container-fluid">
      <div class="row pt-2 px-4">
        {% block content %} {% endblock %}
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
  <script>
    window.USER_CONTEXT = {
        permisos: JSON.parse('{{ current_user.permisos | tojson }}'),
        roles: JSON.parse('{{ current_user.roles | tojson }}'),
        departamentosUsuario: JSON.parse('{{ current_user.departamentos | tojson }}'),
        scopeGlobal: JSON.parse('{{ current_user.scope_departamentos_global | tojson }}')
    }

    function tienePermiso(permiso) {
      return window.USER_CONTEXT?.permisos?.includes(permiso) ?? false;
    }

    function tieneRol(rol) {
      return window.USER_CONTEXT?.roles?.includes(rol) ?? false;
    }

    function puedeVerDepartamento(idDepartment) {
      if (window.USER_CONTEXT?.scopeGlobal) {
        return true;
      }

      return window.USER_CONTEXT?.departamentos?.some(
        (d) => d.idDepartment === idDepartment,
      );
    }
  </script>
</html>
