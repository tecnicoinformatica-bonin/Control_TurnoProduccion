<div class="card card-outline-secondary bg-dark text-light">
  <div class="card-body">
    <h3 class="text-left">Crear departamento</h3>
    <hr />

    {% with messages = get_flashed_messages(with_categories=true) %} {% for
    category, message in messages %}
    <div class="alert alert-{{ category }} alert-dismissible" role="alert">
      <strong>{{ message }}</strong>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {% endfor %} {% endwith %}

    <form
      class="form"
      role="form"
      action="/web/departamento/crearDepartamento_web"
      method="POST"
    >
      <div class="form-group">
        <label for="name">Nombre del departamento</label>
        <input
          type="text"
          class="form-control"
          id="name"
          name="name"
          title="Nombre del departamento"
          required
        />
      </div>
      <div class="form-group mt-3">
        <label for="dept_color">Color del departamento</label>
        <input
          type="text"
          data-coloris
          id="dept_color"
          name="dept_color"
          title="Color del departamento"
        />
      </div>
      <div class="form-group mt-3">
        <input type="hidden" name="activo_hidden" value="0" />
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            name="aplica_horas_extra"
            id="aplica_horas_extra"
            value="1"
          />
          <label class="form-check-label" for="aplica_horas_extra"
            >Aplica a horas extra</label
          >
        </div>
      </div>

      <hr />
      <div class="form-group row">
        <div class="col-md-6">
          <button type="reset" class="btn btn-light btn-lg btn-block">
            Borrar información
          </button>
        </div>
        <div class="col-md-6">
          <button type="submit" class="btn btn-success btn-lg btn-block">
            Crear
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
