<div class="card card-outline-secondary bg-dark text-light">
  <div class="card-body">
    <h3 class="text-left">Crear línea</h3>
    <hr />
    <form
      class="form"
      role="form"
      action="/web/linea/crearLinea_web"
      method="POST"
    >
      <div class="form-group">
        <label for="nameLinea">Nombre de la linea</label>
        <input
          type="text"
          class="form-control"
          id="nameLinea"
          name="nameLinea"
          title="Nombre de la linea"
          required
        />
      </div>

      <div class="form-group">
        <label for="idDepartment"
          >Departamento al que corresponde la línea</label
        >
        <select
          type="text"
          class="form-control"
          id="idDepartment"
          title="Departamento"
          required
          name="idDepartment"
        >
          <option selected disabled value="{{ None }}">
            -- Seleccione una opción --
          </option>
          {% for d in departamentos %}
          <option value="{{ d.idDepartment }}">{{ d.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="minimo_requerido"
          >Número de empleados requeridos por línea</label
        >
        <input
          type="number"
          min="1"
          class="form-control"
          id="minimo_requerido"
          name="minimo_requerido"
          title="Número de empleados requeridos por línea"
          required
        />
      </div>

      <hr />
      <div class="form-group row">
        <div class="col-md-6">
          <button type="reset" class="btn btn-light btn-lg btn-block">
            Borrar información
          </button>
        </div>
        <div class="col-md-6">
          <button type="submit" class="btn btn-success btn-lg btn-block">
            Crear
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
